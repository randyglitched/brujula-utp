<html lang="es">
<head>
<meta charset="UTF-8">

<title>Brújula UTP — Orientación Vocacional</title>

<style>
  :root{
    --ink:#0E1B2C;
    --ink-2:#132538;
    --ink-3:#1A3049;
    --line:#3D6C8C;
    --line-dim:#24425A;
    --brass:#D89B3C;
    --brass-light:#F0C878;
    --text:#E7EDF2;
    --text-dim:#8FA6B8;
    --ok:#6FA787;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--line-dim) 0px, var(--line-dim) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, var(--line-dim) 0px, var(--line-dim) 1px, transparent 1px, transparent 40px),
      var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }
  #app{
    width:100%;
    max-width:720px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--brass-light);
    margin-bottom:6px;
  }
  h1,h2,h3{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    margin:0 0 8px;
    color:var(--text);
  }
  h1{font-size:28px;}
  h2{font-size:20px;}
  p{line-height:1.55; color:var(--text-dim); margin:0 0 16px;}
  .card{
    background:var(--ink-2);
    border:1px solid var(--line-dim);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:16px;
  }
  .btn{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{background:var(--brass-light); transform:translateY(-1px);}
  .btn:disabled{background:var(--line-dim); color:var(--text-dim); cursor:not-allowed; transform:none;}
  .btn-ghost{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line-dim);
  }
  .btn-ghost:hover{background:var(--ink-3); color:var(--text);}
  .btn-row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px;}
  .progress-wrap{
    display:flex; align-items:center; gap:12px; margin-bottom:24px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim);
  }
  .progress-bar{flex:1; height:6px; background:var(--ink-3); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--line), var(--brass)); transition:width .3s ease;}
  .question{
    border-bottom:1px solid var(--line-dim);
    padding:18px 0;
  }
  .question:last-child{border-bottom:none;}
  .question-text{font-size:15px; color:var(--text); margin-bottom:12px; line-height:1.5;}
  .qnum{font-family:'IBM Plex Mono', monospace; color:var(--brass-light); font-size:12px; margin-right:8px;}
  .likert-row{display:flex; align-items:center; gap:8px;}
  .likert-label{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); width:92px;}
  .likert-label.right{text-align:right;}
  .likert-options{display:flex; gap:10px; flex:1; justify-content:center;}
  .likert-opt{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-family:'IBM Plex Mono', monospace; font-size:13px;
    color:var(--text-dim);
    transition:all .12s ease;
    background:transparent;
  }
  .likert-opt:hover{border-color:var(--brass-light); color:var(--text);}
  .likert-opt.selected{
    background:var(--brass); border-color:var(--brass); color:var(--ink); font-weight:600;
  }
  textarea{
    width:100%; min-height:90px; background:var(--ink-3); border:1px solid var(--line-dim);
    border-radius:8px; color:var(--text); font-family:'IBM Plex Sans', sans-serif; font-size:14px;
    padding:12px; resize:vertical;
  }
  textarea:focus{outline:none; border-color:var(--brass);}
  .career-card{
    background:var(--ink-2); border:1px solid var(--line-dim); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px;
  }
  .career-card.top{border-color:var(--brass);}
  .career-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .career-rank{font-family:'IBM Plex Mono', monospace; color:var(--brass-light); font-size:13px;}
  .career-name{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:17px;}
  .career-score{font-family:'IBM Plex Mono', monospace; font-size:20px; color:var(--brass-light);}
  .career-meta{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .badge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10px;
    padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim);
    margin-top:8px;
  }
  .badge.warn{border-color:var(--brass); color:var(--brass-light);}
  .score-bar{height:5px; background:var(--ink-3); border-radius:3px; overflow:hidden; margin-top:10px;}
  .score-fill{height:100%; background:var(--brass);}
  .hex-wrap{display:flex; justify-content:center; margin:20px 0;}
  .legend{display:flex; gap:20px; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); margin-top:8px;}
  .legend span::before{content:''; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .legend .u::before{background:var(--brass);}
  .legend .c::before{background:var(--line);}
  .checkbox-row{display:flex; align-items:flex-start; gap:10px; margin-top:14px;}
  .checkbox-row input{margin-top:3px; accent-color:var(--brass); width:16px; height:16px; flex-shrink:0;}
  .checkbox-row label{font-size:13px; color:var(--text-dim); line-height:1.5;}
  .banner{
    background:var(--ink-3); border:1px solid var(--brass); border-radius:8px;
    padding:14px 16px; margin-bottom:16px; font-size:13px; color:var(--text);
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .banner.alerta{border-color:#C97A4A;}
  .link-toggle{
    background:none; border:none; color:var(--brass-light); font-family:'IBM Plex Mono', monospace;
    font-size:12px; cursor:pointer; text-decoration:underline; padding:0;
  }
  .mini-row{
    display:flex; justify-content:space-between; align-items:center; padding:8px 0;
    border-bottom:1px solid var(--line-dim); font-size:13px;
  }
  .mini-row:last-child{border-bottom:none;}
  @media print{
    body{background:#fff; color:#111;}
    .btn-row, #btn-imprimir, #btn-reiniciar, .progress-wrap{display:none !important;}
    .card, .career-card{background:#fff; border:1px solid #ccc;}
    h1,h2,h3,.career-name{color:#111;}
    p, .career-meta, .legend{color:#333;}
  }
</style>
</head>

// ============ MOTOR DE SCORING (portado de scoring.js) ============
function normalizarRespuesta(valorLikert, esReverso) {
  const valor = esReverso ? 6 - valorLikert : valorLikert;
  return ((valor - 1) / 4) * 100;
}
function construirVectorRiasec(resp) {
  const vector = {};
  RIASEC_ORDER.forEach((dim) => {
    const valores = RIASEC_BANK[dim].map((item) => normalizarRespuesta(resp[item.id], false));
    vector[dim] = valores.reduce((a, b) => a + b, 0) / valores.length;
  });
  return vector;
}
function construirVectorBig5(resp) {
  const vector = {};
  Object.keys(BIG5_BANK).forEach((rasgo) => {
    const valores = BIG5_BANK[rasgo].map((item) => normalizarRespuesta(resp[item.id], item.reverso));
    vector[rasgo] = valores.reduce((a, b) => a + b, 0) / valores.length;
  });
  return vector;
}
function similitudCoseno(vecA, vecB) {
  const claves = Object.keys(vecA);
  let dot = 0, normA = 0, normB = 0;
  claves.forEach((k) => {
    dot += vecA[k] * vecB[k];
    normA += vecA[k] * vecA[k];
    normB += vecB[k] * vecB[k];
  });
  if (normA === 0 || normB === 0) return 0;
  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}
function calcularMatch(resp) {
  const PESO_RIASEC = 0.7, PESO_BIG5 = 0.3;
  const vUsuarioRiasec = construirVectorRiasec(resp);
  const vUsuarioBig5 = construirVectorBig5(resp);
  const resultados = CAREERS.map((carrera) => {
    const perfilBig5 = {
      apertura: carrera.big5.apertura,
      responsabilidad: carrera.big5.responsabilidad,
      extraversion: carrera.big5.extraversion,
      amabilidad: carrera.big5.amabilidad,
      estabilidad_emocional: carrera.big5.estabilidad,
    };
    const simRiasec = similitudCoseno(vUsuarioRiasec, carrera.riasec);
    const simBig5 = similitudCoseno(vUsuarioBig5, perfilBig5);
    const scoreFinal = (simRiasec * PESO_RIASEC + simBig5 * PESO_BIG5) * 100;
    return { ...carrera, score_final: Math.round(scoreFinal * 10) / 10 };
  });
  resultados.sort((a, b) => b.score_final - a.score_final);
  return { vectorRiasec: vUsuarioRiasec, vectorBig5: vUsuarioBig5, ranking: resultados };
}

// ============ HEXAGONO SVG (Holland hexagon) ============
function hexPoint(value, index, cx, cy, maxR) {
  const angle = (Math.PI / 180) * (-90 + index * 60);
  const r = (Math.max(0, Math.min(100, value)) / 100) * maxR;
  return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
}
function renderHexSVG(vectorA, vectorB, labelA, labelB) {
  const cx = 150, cy = 150, maxR = 110;
  const anillos = [0.25, 0.5, 0.75, 1].map((f) => {
    const pts = RIASEC_ORDER.map((_, i) => hexPoint(100 * f, i, cx, cy, maxR).join(",")).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="var(--line-dim)" stroke-width="1"/>`;
  }).join("");
  const ejes = RIASEC_ORDER.map((_, i) => {
    const [x, y] = hexPoint(100, i, cx, cy, maxR);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line-dim)" stroke-width="1"/>`;
  }).join("");
  const labels = RIASEC_ORDER.map((dim, i) => {
    const [x, y] = hexPoint(122, i, cx, cy, maxR);
    return `<text x="${x}" y="${y}" fill="var(--text-dim)" font-family="IBM Plex Mono" font-size="12" text-anchor="middle" dominant-baseline="middle">${dim}</text>`;
  }).join("");
  const polyFrom = (vec, color, opacity) => {
    const pts = RIASEC_ORDER.map((dim, i) => hexPoint(vec[dim], i, cx, cy, maxR).join(",")).join(" ");
    return `<polygon points="${pts}" fill="${color}" fill-opacity="${opacity}" stroke="${color}" stroke-width="2"/>`;
  };
  let poly = "";
  if (vectorB) poly += polyFrom(vectorB, "var(--line)", 0.18);
  poly += polyFrom(vectorA, "var(--brass)", 0.28);
  return `<svg width="300" height="300" viewBox="0 0 300 300">${anillos}${ejes}${poly}${labels}</svg>`;
}

      <p>• No hay respuestas correctas o incorrectas. Responde con lo que sueles hacer o sentir, no lo que crees que "deberías".</p>
      <p>• El resultado es un punto de partida para conversar con orientación académica, no un veredicto definitivo.</p>

        <div class="question-text">¿Qué carrera estás estudiando actualmente (si aplica)?</div>

      <div class="checkbox-row">
        <input type="checkbox" id="check-consentimiento" ${consentimientoIA ? "checked" : ""}>
        <label for="check-consentimiento">Acepto que mis 5 respuestas abiertas se envíen a un servicio de IA (Anthropic) para generar una
        lectura personalizada del resultado. Si no marcas esto, el test funciona igual, solo sin ese párrafo final.</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="check-estadisticas" ${consentimientoEstadisticas ? "checked" : ""}>
        <label for="check-estadisticas">Acepto que un resumen de mi resultado (sin mis respuestas abiertas: solo mi mejor match, mi carrera
        actual si la diste, y si hay desalineación) se guarde para que la universidad tenga estadísticas agregadas sobre deserción vocacional.</label>
      </div>
      <div class="question" style="border-bottom:none;">
        <div class="question-text">Correo institucional (opcional — solo si aceptaste lo anterior y quieres que orientación académica pueda darte seguimiento)</div>
        <input type="email" id="input-correo" placeholder="tu-correo@utp.ac.pa" style="width:100%; background:var(--ink-3); border:1px solid var(--line-dim); border-radius:8px; color:var(--text); font-family:'IBM Plex Sans', sans-serif; font-size:14px; padding:10px;">
      </div>
    </div>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn" id="btn-empezar">Comenzar →</button>
    </div>
  `;
}

function htmlPagina(idx) {
  const pag = PAGINAS[idx];
  const totalPaginas = PAGINAS.length;
  const progresoPct = Math.round((idx / totalPaginas) * 100);
  let contenido = "";

  if (pag.tipo === "likert") {
    contenido = pag.items.map((item, i) => {
      const seleccion = respuestas[item.id];
      const opciones = [1, 2, 3, 4, 5].map((v) => `
        <div class="likert-opt ${seleccion === v ? "selected" : ""}" data-id="${item.id}" data-val="${v}">${v}</div>
      `).join("");
      return `
        <div class="question">
          <div class="question-text"><span class="qnum">${String(i + 1).padStart(2, "0")}</span>${item.texto}</div>
          <div class="likert-row">
            <div class="likert-label">Desacuerdo</div>
            <div class="likert-options">${opciones}</div>
            <div class="likert-label right">De acuerdo</div>
          </div>
        </div>
      `;
    }).join("");
  } else {
    contenido = pag.items.map((item, i) => `
      <div class="question">
        <div class="question-text"><span class="qnum">${String(i + 1).padStart(2, "0")}</span>${item.texto}</div>
        <textarea data-abierta-id="${item.id}" placeholder="Escribe con confianza, sin filtro...">${escapeHtml(respuestasAbiertas[item.id] || "")}</textarea>
      </div>
    `).join("");
  }

  const completa = paginaCompleta(idx);
  const esUltima = idx === totalPaginas - 1;

  return `
    <div class="progress-wrap">
      <span>PÁGINA ${idx + 1} / ${totalPaginas}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${progresoPct}%"></div></div>
      <span>${progresoPct}%</span>
    </div>
    <div class="eyebrow">${pag.tipo === "likert" ? "Bloque de interés / rasgo" : "Reflexión abierta"}</div>
    <h2>${pag.titulo}</h2>
    ${pag.subtitulo ? `<p>${pag.subtitulo}</p>` : ""}
    <div class="card">${contenido}</div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-atras" ${idx === 0 ? "disabled" : ""}>← Atrás</button>
      <button class="btn" id="btn-siguiente" ${completa ? "" : "disabled"}>${esUltima ? "Ver mis resultados →" : "Siguiente →"}</button>
    </div>
  `;
}

function paginaCompleta(idx) {
  const pag = PAGINAS[idx];
  if (pag.tipo === "likert") return pag.items.every((item) => respuestas[item.id] !== undefined);
  return pag.items.every((item) => (respuestasAbiertas[item.id] || "").trim().length > 0);
}

function detectarRespuestaUniforme(resp) {
  const valores = Object.values(resp);
  if (valores.length < 10) return false;
  const media = valores.reduce((a, b) => a + b, 0) / valores.length;
  const varianza = valores.reduce((a, b) => a + (b - media) ** 2, 0) / valores.length;
  return Math.sqrt(varianza) < 0.5;
}

function htmlResultados() {
  const resultado = calcularMatch(respuestas);
  const top = resultado.ranking.slice(0, 5);
  const mejor = top[0];
  const maxScore = top[0].score_final;
  const esUniforme = detectarRespuestaUniforme(respuestas);

      ${!c.completa_en_azuero ? `<div class="badge warn">Solo ${c.anios_en_azuero} en Azuero — resto en Campus Central</div>` : `<div class="badge">Carrera completa en Azuero</div>`}

  const filasRankingCompleto = resultado.ranking.map((c, i) => `

  const tarjetaComparacion = carreraActual ? `
    <div class="card">
      <h3>Lo que estudias hoy vs. tu resultado</h3>
      <p>Actualmente estudias <strong style="color:var(--text);">${carreraActual.nombre}</strong>.
      En este test, quedó en el puesto <strong style="color:var(--brass-light);">#${puestoActual} de 24</strong>,
      con una compatibilidad de <strong style="color:var(--brass-light);">${carreraActual.score_final}</strong>.
      ${puestoActual <= 3
        ? "Está entre tus mejores matches — buena señal de que vas alineado con tus intereses."
        : puestoActual <= 8
          ? "Está en una posición media — ni un desajuste fuerte, ni tu match ideal. Vale la pena que lo converses con orientación académica."
          : "Hay una diferencia notable entre tu perfil de intereses y esta carrera. Eso no significa que debas cambiarte — pero sí es información real que antes no tenías, y que vale la pena conversar con un orientador antes de decidir cualquier cosa."}
      </p>
    </div>
  ` : "";

  const bannerUniforme = esUniforme ? `
    <div class="banner alerta">
      <span>⚠ Tus respuestas variaron muy poco entre sí. Esto puede pasar cuando se responde rápido o sin pensarlo mucho,
      y reduce la precisión del resultado. Considera repetirlo con más calma antes de tomarlo como definitivo.</span>
    </div>
  ` : "";

  const cardIA = consentimientoIA ? `
    <div class="card" id="ia-card">
      <h3>Lectura de tus respuestas abiertas</h3>
      <p id="ia-texto" style="color:var(--text-dim); font-style:italic;">Generando lectura personalizada...</p>
    </div>
  ` : `
    <div class="card">
      <h3>Sobre tus respuestas abiertas</h3>
      <p>No marcaste la casilla de consentimiento para enviarlas a la IA, así que no se generó una lectura automática.
      Quedan guardadas en tu navegador para que las repases con un orientador académico si quieres.</p>
    </div>
  `;

  return `
    <div class="eyebrow">Resultado</div>
    <h1>Tu perfil vocacional</h1>
    <p>Comparamos tu perfil de intereses (RIASEC) contra los 24 perfiles de carrera de Azuero. Esto es un punto de partida
    para la conversación con orientación académica — no una sentencia.</p>
    ${bannerUniforme}
    <div class="card" style="text-align:center;">
      <div class="hex-wrap">${renderHexSVG(resultado.vectorRiasec, mejor.riasec)}</div>
      <div class="legend"><span class="u">Tu perfil</span><span class="c">${mejor.nombre}</span></div>
    </div>
    <h2 style="margin-top:24px;">Tus 5 mejores matches</h2>
    ${tarjetas}
    <div class="card">
      <button class="link-toggle" id="btn-toggle-ranking">${mostrarRankingCompleto ? "▲ Ocultar ranking completo" : "▼ Ver ranking completo (24 carreras)"}</button>
      ${mostrarRankingCompleto ? `<div style="margin-top:12px;">${filasRankingCompleto}</div>` : ""}
    </div>
    ${tarjetaComparacion}
    ${cardIA}
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-reiniciar">↺ Repetir el test</button>
      <button class="btn" id="btn-imprimir">🖨 Guardar / imprimir resultado</button>
    </div>
  `;
}

function limpiarMarkdown(texto) {
  return texto
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/[*#]/g, "")
    .trim();
}

// ============ ANALISIS CUALITATIVO CON IA (capa opcional) ============
async function generarLecturaIA(top3) {
  try {
    const preguntasYRespuestas = OPEN_QUESTIONS.map(
      (q) => `Pregunta: ${q.texto}\nRespuesta: ${respuestasAbiertas[q.id] || "(sin responder)"}`
    ).join("\n\n");
    const carrerasTexto = top3.map((c, i) => `${i + 1}. ${c.nombre} (score ${c.score_final})`).join("\n");

    const prompt = `Eres un orientador vocacional cálido y directo, hablando con un estudiante universitario panameño.
Con base en estas 5 respuestas abiertas y sus 3 mejores matches de carrera (calculados matemáticamente con RIASEC/Big Five),
escribe un párrafo de 120-180 palabras en español, cercano y sin sonar a informe corporativo, que conecte 1-2 detalles
concretos de sus respuestas con el resultado. No repitas los scores numéricos. No inventes datos que no estén en las respuestas.

FORMATO — REGLA ESTRICTA: tu respuesta se muestra como texto plano sin ningún renderizado de Markdown. Por lo tanto:
- Prohibido usar el caracter "*" en cualquier cantidad (ni "*cursiva*" ni "**negrita**") para dar énfasis. Si quieres enfatizar algo, usa la palabra misma o el orden de la oración, nunca símbolos.
- Prohibido usar "#" para títulos o encabezados.
- Prohibido usar listas, viñetas, o numeración.
- Un solo párrafo corrido, como si se lo estuvieras diciendo de viva voz a la persona.
Revisa tu respuesta antes de responder: si contiene algún "*" o "#", reescríbela sin esos caracteres.

RESPUESTAS DEL ESTUDIANTE:
${preguntasYRespuestas}

MEJORES MATCHES:
${carrerasTexto}`;

    const response = await fetch("/api/analizar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    if (!response.ok) throw new Error("Fallo la funcion serverless");
    const data = await response.json();
    if (!data.texto) throw new Error("Respuesta vacia");

    iaEstado = "listo";
    iaTexto = limpiarMarkdown(data.texto);
    const el = document.getElementById("ia-texto");
    if (el) {
      el.textContent = iaTexto;
      el.style.fontStyle = "normal";
      el.style.color = "var(--text)";
    }
  } catch (e) {
    iaEstado = "error";
    mostrarErrorIA();
  }
}

function mostrarErrorIA() {
  const el = document.getElementById("ia-texto");
  if (el) {
    el.textContent = "No se pudo generar la lectura automática (revisa que ANTHROPIC_API_KEY esté configurada en Vercel, o que haya conexión). Tus respuestas abiertas quedan disponibles para que un orientador académico las lea directamente.";
    el.style.fontStyle = "normal";
    el.style.color = "var(--text-dim)";
  }
  const card = document.getElementById("ia-card");
  if (card && !document.getElementById("ia-reintentar-wrap")) {
    const wrap = document.createElement("div");
    wrap.id = "ia-reintentar-wrap";
    wrap.style.marginTop = "12px";
    wrap.innerHTML = `<button class="btn btn-ghost" id="btn-reintentar-ia">↺ Reintentar</button>`;
    card.appendChild(wrap);
    document.getElementById("btn-reintentar-ia").addEventListener("click", () => {
      iaEstado = "cargando";
      const elTexto = document.getElementById("ia-texto");
      if (elTexto) { elTexto.textContent = "Generando lectura personalizada..."; elTexto.style.fontStyle = "italic"; elTexto.style.color = "var(--text-dim)"; }
      wrap.remove();
      generarLecturaIA(calcularMatch(respuestas).ranking.slice(0, 3));
    });
  }
}

// ============ EVENTOS ============
function bindEvents() {
  const btnEmpezar = document.getElementById("btn-empezar");
  if (btnEmpezar) btnEmpezar.addEventListener("click", () => {
    const sel = document.getElementById("select-carrera-actual");
    const check = document.getElementById("check-consentimiento");
    const checkStats = document.getElementById("check-estadisticas");
    const correo = document.getElementById("input-correo");
    estudiante.carreraActualId = sel ? sel.value : "";
    estudiante.correo = correo ? correo.value.trim() : "";
    consentimientoIA = check ? check.checked : false;
    consentimientoEstadisticas = checkStats ? checkStats.checked : false;
    pantalla = "pregunta";
    paginaActual = 0;
    guardarProgreso();
    render();
  });

  const btnContinuarGuardado = document.getElementById("btn-continuar-guardado");
  if (btnContinuarGuardado) btnContinuarGuardado.addEventListener("click", () => {
    const guardado = cargarProgresoGuardado();
    if (guardado) {
      respuestas = guardado.respuestas || {};
      respuestasAbiertas = guardado.respuestasAbiertas || {};
      paginaActual = guardado.paginaActual || 0;
      estudiante = guardado.estudiante || { nombre: "", carreraActualId: "", correo: "" };
      consentimientoIA = guardado.consentimientoIA || false;
      consentimientoEstadisticas = guardado.consentimientoEstadisticas || false;
      pantalla = "pregunta";
      render();
    }
  });

  document.querySelectorAll(".likert-opt").forEach((el) => {
    el.addEventListener("click", () => {
      respuestas[el.dataset.id] = parseInt(el.dataset.val, 10);
      guardarProgreso();
      render();
    });
  });

  document.querySelectorAll("textarea[data-abierta-id]").forEach((el) => {
    el.addEventListener("input", () => {
      respuestasAbiertas[el.dataset.abiertaId] = el.value;
      guardarProgreso();
      const btn = document.getElementById("btn-siguiente");
      if (btn) btn.disabled = !paginaCompleta(paginaActual);
    });
  });

  const btnAtras = document.getElementById("btn-atras");
  if (btnAtras) btnAtras.addEventListener("click", () => {
    if (paginaActual > 0) { paginaActual -= 1; guardarProgreso(); render(); }
  });

  const btnSiguiente = document.getElementById("btn-siguiente");
  if (btnSiguiente) btnSiguiente.addEventListener("click", () => {
    if (paginaActual < PAGINAS.length - 1) {
      paginaActual += 1;
      guardarProgreso();
      render();
    } else {
      pantalla = "resultados";
      borrarProgresoGuardado();
      render();
    }
  });

  const btnReiniciar = document.getElementById("btn-reiniciar");
  if (btnReiniciar) btnReiniciar.addEventListener("click", () => {
    respuestas = {};
    respuestasAbiertas = {};
    estudiante = { nombre: "", carreraActualId: "", correo: "" };
    consentimientoIA = false;
    consentimientoEstadisticas = false;
    mostrarRankingCompleto = false;
    statsEnviadas = false;
    iaEstado = "pendiente";
    iaTexto = "";
    paginaActual = 0;
    pantalla = "intro";
    borrarProgresoGuardado();
    render();
  });

  const btnImprimir = document.getElementById("btn-imprimir");
  if (btnImprimir) btnImprimir.addEventListener("click", () => window.print());

  const btnToggleRanking = document.getElementById("btn-toggle-ranking");
  if (btnToggleRanking) btnToggleRanking.addEventListener("click", () => {
    mostrarRankingCompleto = !mostrarRankingCompleto;
    render();
  });
}

render();
</script>
